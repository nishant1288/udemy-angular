<h2> Child Component </h2>
<p>{{recieveMsg}}</p>

<div>
    {{recieveCourses | json}}

    <table>
        <thead>
            <th>ID</th>
            <th>Name</th>
        </thead>
        <tbody>
            <tr *ngFor="let course of recieveCourses">
                <td>{{course.id}}</td>
                <td>{{course.name}}</td>
            </tr>
        </tbody>
    </table>
</div>

<button (click)="emitEvent()">Click Me</button>

<div>
    <ul>
        <li *ngFor="let item of itemsArrayFromParent; let i = index">
            {{item}} <button (click)="outputEventForIndexDelete(i)">Delete</button>
        </li>
    </ul>
</div>
